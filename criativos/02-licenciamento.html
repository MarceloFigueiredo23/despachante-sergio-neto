<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #eef3f9;
    background: #0d1a2b url("file:///C:/Users/marce/OneDrive/%C3%81rea%20de%20Trabalho/despachante-sergio-neto/criativos/bg/02-licenciamento.jpg.png") center/cover no-repeat;
    position: relative;
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(115deg, rgba(10,22,40,.92) 0%, rgba(10,22,40,.78) 42%, rgba(10,22,40,.35) 68%, rgba(10,22,40,.55) 100%),
      linear-gradient(180deg, rgba(10,22,40,.25) 0%, transparent 35%, rgba(10,22,40,.88) 100%);
  }
  .frame {
    position: relative; z-index: 1;
    width: 1080px; height: 1080px;
    padding: 56px 60px 52px;
    display: flex; flex-direction: column;
  }
  .top {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 56px;
  }
  .logo {
    width: 132px; height: 132px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(232,163,23,.7), 0 16px 36px rgba(0,0,0,.45);
  }
  .brand-line {
    font-size: 20px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(238,243,249,.82);
    text-shadow: 0 2px 12px rgba(0,0,0,.45);
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 20px; font-weight: 800; letter-spacing: .16em;
    color: #f0b429; margin-bottom: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .eyebrow::before { content: ""; width: 36px; height: 3px; background: #f0b429; }
  h1 {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 84px; line-height: .94; letter-spacing: .02em;
    font-weight: 400; margin-bottom: 22px; max-width: 11ch;
    text-transform: uppercase;
    color: #ffffff;
    -webkit-text-fill-color: #ffffff;
    text-shadow: 0 4px 22px rgba(0,0,0,.55);
  }
  .body {
    font-size: 28px; line-height: 1.38; font-weight: 600;
    color: rgba(238,243,249,.94); max-width: 17ch; margin-bottom: auto;
    text-shadow: 0 2px 14px rgba(0,0,0,.55);
  }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    border-top: 1px solid rgba(238,243,249,.22);
    padding-top: 24px; margin-top: 28px;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    background: #25d366; color: #062312;
    font-weight: 800; font-size: 22px;
    padding: 16px 24px; border-radius: 999px;
    box-shadow: 0 10px 24px rgba(0,0,0,.35);
  }
  .wa {
    width: 32px; height: 32px; border-radius: 50%;
    background: #062312; color: #25d366;
    display: grid; place-items: center; font-size: 16px; font-weight: 800;
  }
  .handle {
    text-align: right; font-size: 18px; font-weight: 700;
    color: rgba(238,243,249,.75); letter-spacing: .03em;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .chip {
    position: absolute; right: 52px; top: 210px;
    background: rgba(232,163,23,.92); color: #12263f;
    font-weight: 800; font-size: 18px; letter-spacing: .08em;
    padding: 10px 16px; border-radius: 8px;
    text-transform: uppercase;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="frame">
    <div class="chip">Post 02</div>
    <div class="top">
      <img class="logo" src="file:///C:/Users/marce/OneDrive/%C3%81rea%20de%20Trabalho/despachante-sergio-neto/logo.png" alt="" />
      <div class="brand-line">Despachante Sérgio Neto · Biju</div>
    </div>
    <div class="eyebrow">NÃO DEIXE PARA DEPOIS</div>
    <h1>LICENCIAMENTO<br>EM DIA</h1>
    <p class="body">Circular tranquilo começa com a documentação certa. A gente resolve pra você em Cosmópolis.</p>
    <div class="footer">
      <div class="cta"><span class="wa">W</span>WhatsApp 19 99185-1849</div>
      <div class="handle">@despachante_sergioneto</div>
    </div>
  </div>
</body>
</html>
